<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Occra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="main">
  <div class="top"><div class="brand">Occra<i></i></div></div>
  <div class="center">
    <div class="stage"><div id="yt"></div><div class="empty" id="empty">Search for a song or paste a YouTube link in the list on the right</div></div>
    <div class="title" id="title">—</div>
    <div class="sub" id="sub">Nothing playing</div>
    <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
    <div class="ctl">
      <button id="shuf" class="sm" title="Shuffle">⇄</button>
      <button id="prev" title="Previous">⏮</button>
      <button id="pp" class="play" title="Play / Pause">▶</button>
      <button id="next" title="Next">⏭</button>
      <button id="rep" class="sm" title="Repeat">⟳</button>
    </div>
    <div class="vrow"><span>♪</span><input type="range" class="vol" id="vol" min="0" max="100" value="80" title="Volume"></div>
  </div>
</div>
<aside>
  <div class="ph"><input id="plname" class="plname" spellcheck="false" title="Click to rename playlist"></div>
  <div class="pl">
    <select id="sel"></select>
    <button class="ib" id="nl" title="New playlist">+</button>
    <button class="ib" id="rn" title="Rename">✎</button>
    <button class="ib" id="dl" title="Delete playlist">✕</button>
  </div>
  <div class="add"><input type="text" id="url" placeholder="Search, or paste a video / playlist link"><button id="go">Add</button></div>
  <div class="mine"><button id="mine"><span class="mi"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/></svg></span><span class="mt"><b>Import from YouTube</b><small>Sign in with Google to bring in your playlists</small></span><span class="ma">›</span></button></div>
  <div class="msg"><span id="msg"></span><a id="back" style="display:none">← Back</a></div>
  <div class="hd" id="hd"></div>
  <ul id="list"></ul>
</aside>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
